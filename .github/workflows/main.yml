name: Protect Main

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]
  schedule:
    # Run weekly (Mondays at 06:00 UTC) even without a push.
    - cron: "0 6 * * 1"

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # GUARD: Fail if any push or PR against master/main touches the protected
  # backend source tree. All source changes must flow through dev-backend and
  # be explicitly reviewed by a maintainer — never committed directly to master.
  # ─────────────────────────────────────────────────────────────────────────────
  guard-source-integrity:
    name: "Guard — no touches to main backend source"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for forbidden file changes
        env:
          AUTHOR_ASSOC: ${{ github.event.pull_request.author_association }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # PRs opened by the repo owner, org members or collaborators are
            # maintainer releases; fork contributors are still guarded.
            case "$AUTHOR_ASSOC" in
              OWNER|MEMBER|COLLABORATOR)
                echo "✅  PR by a maintainer ($AUTHOR_ASSOC). Guard skipped."
                exit 0 ;;
            esac
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            # The push a maintainer PR's merge creates on master: skip when
            # the commit came from a merged PR opened by a maintainer.
            MAINTAINER_PRS=$(gh api "repos/$REPO/commits/${{ github.sha }}/pulls" \
              --jq '[.[] | select(.merged_at != null) | select(.author_association == "OWNER" or .author_association == "MEMBER" or .author_association == "COLLABORATOR")] | length' \
              2>/dev/null || echo 0)
            if [ "${MAINTAINER_PRS:-0}" -gt 0 ]; then
              echo "✅  Commit is a merged maintainer PR. Guard skipped."
              exit 0
            fi
            BASE="${{ github.event.before }}"
          fi

          # First push to the branch — nothing to diff against.
          if [[ "$BASE" == "0000000000000000000000000000000000000000" ]]; then
            echo "First push to branch — skipping diff guard."
            exit 0
          fi

          CHANGED=$(git diff --name-only "$BASE" "${{ github.sha }}" 2>/dev/null || true)

          echo "Changed files:"
          echo "$CHANGED"

          # Protected paths — must not be modified directly on master/main.
          FORBIDDEN_PATTERNS=(
            "^src/"
            "^migrations/"
            "^examples/"
            "^Dockerfile$"
            "^Cargo\.toml$"
            "^Cargo\.lock$"
            "^wrangler\.jsonc$"
            "^cloudflare/"
          )

          VIOLATIONS=""
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            for pattern in "${FORBIDDEN_PATTERNS[@]}"; do
              if echo "$file" | grep -qE "$pattern"; then
                VIOLATIONS="${VIOLATIONS}\n  ❌  $file  (matches protected pattern: $pattern)"
                break
              fi
            done
          done <<< "$CHANGED"

          if [ -n "$VIOLATIONS" ]; then
            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "🚫  MAIN SOURCE INTEGRITY GUARD FAILED"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo ""
            echo "The following files belong to the protected backend source"
            echo "tree and must NOT be modified directly on master/main:"
            echo -e "$VIOLATIONS"
            echo ""
            echo "All changes to the backend source must:"
            echo "  1. Be made on the dev-backend branch"
            echo "  2. Pass the dev-backend CI guard"
            echo "  3. Be reviewed and merged by a maintainer"
            echo ""
            echo "Direct commits or PRs that modify production source files"
            echo "will always be rejected by this check."
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            exit 1
          fi

          echo "✅  No protected files touched. Guard passed."

  # ─────────────────────────────────────────────────────────────────────────────
  # SECURITY: Scan pinned dependencies for known vulnerabilities (CVEs).
  # Fails the build on high/critical advisories. Runs on every push/PR and
  # weekly via the schedule trigger above so new advisories are caught even
  # when the codebase is idle.
  # ─────────────────────────────────────────────────────────────────────────────
  cargo-audit:
    name: "Security — cargo audit"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        # --deny warnings fails the job on any advisory (high/critical included).
        # Known false positives are ignored via .cargo/audit.toml with justification.
        run: cargo audit --deny warnings
