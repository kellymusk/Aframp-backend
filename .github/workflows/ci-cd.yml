name: CI/CD Pipeline

on:
  pull_request:
    branches: [develop]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Image tag to deploy to production (e.g. v1.2.3)"
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Minimum overall code coverage threshold (%)
  COVERAGE_THRESHOLD: "80"
  # Minimum coverage threshold (%) for critical financial modules
  CRITICAL_MODULE_COVERAGE_THRESHOLD: "90"
  # Max allowed coverage regression (%) vs. the tracked baseline
  COVERAGE_MAX_REGRESSION: "2"
  COVERAGE_BASELINE_FILE: coverage-baseline.txt

# ── Shared permissions ────────────────────────────────────────────────────────
permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  # ── Changelog enforcement: every PR must update CHANGELOG.md ───────────────
  changelog-check:
    name: Changelog Updated
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify CHANGELOG.md was updated
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          if git diff --name-only "$BASE"...HEAD | grep -q 'CHANGELOG.md'; then
            echo "✅ CHANGELOG.md updated in this PR"
          else
            # Only require an update when source files changed
            CHANGED=$(git diff --name-only "$BASE"...HEAD)
            if echo "$CHANGED" | grep -qE '^(src/|migrations/|\.github/workflows/|Cargo\.toml)'; then
              echo "❌ PR changes src/, migrations/, .github/workflows/, or Cargo.toml"
              echo "   but CHANGELOG.md was not updated."
              echo ""
              echo "   Add an entry under [Unreleased] in CHANGELOG.md describing your change."
              exit 1
            else
              echo "ℹ️  No source/migration/CI changes detected — CHANGELOG.md update not required"
            fi
          fi

  # ── Guard: PRs must target develop or master, not an arbitrary branch ────────
  check-target:
    name: Verify PR target branch
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Verify base branch
        run: |
          BASE="${{ github.event.pull_request.base.ref }}"
          if [[ "$BASE" != "develop" && "$BASE" != "master" && "$BASE" != "main" ]]; then
            echo "🚫 Pull requests must target 'develop', 'master', or 'main'. Got: $BASE"
            exit 1
          fi
          echo "✅ PR targets valid base branch: $BASE"

  # ── Change detection ────────────────────────────────────────────────────────
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      integration: ${{ steps.filter.outputs.integration }}
      ci: ${{ steps.filter.outputs.ci }}
      openapi: ${{ steps.filter.outputs.openapi }}
      config: ${{ steps.filter.outputs.config }}
      stellar: ${{ steps.filter.outputs.stellar }}
    steps:
      - uses: actions/checkout@v4
      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            rust:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'src/**'
              - 'tests/**'
              - 'examples/**'
            integration:
              - 'migrations/**'
              - 'db/**'
              - 'src/database/**'
              - 'src/cache/**'
              - 'tests/**integration*.rs'
            ci:
              - '.github/workflows/**'
            openapi:
              - 'src/api/openapi.rs'
              - 'src/**'
            config:
              - 'config/production.toml'
              - 'k8s/production/configmap.yaml'
              - 'scripts/detect_config_drift.py'
            stellar:
              - 'src/stellar/**'
              - 'src/chains/stellar/**'
              - 'benches/xdr_parser.rs'
              - 'scripts/compare_benchmarks.py'

  # ── Formatting ──────────────────────────────────────────────────────────────
  fmt:
    name: Formatting (rustfmt)
    runs-on: ubuntu-latest
    needs: [changes]
    if: github.event_name == 'push' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.ci == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  # ── Linting ─────────────────────────────────────────────────────────────────
  clippy:
    name: Lint (clippy)
    runs-on: ubuntu-latest
    needs: [changes]
    if: github.event_name == 'push' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.ci == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Run clippy (deny warnings)
        # Issue #791: also deny unwrap_used and expect_used to prevent panics in
        # production code paths. Tests are excluded via --lib/--bins targets.
        run: |
          cargo clippy --lib --bins --all-features -- \
            -D warnings \
            -D clippy::unwrap_used \
            -D clippy::expect_used
      - name: Detect SQL injection patterns (issue #720)
        # Ensures no format!() strings are passed directly to sqlx::query/query_as/query_scalar.
        # All user-influenced values must be bound as parameters via .bind().
        # Table/column identifiers must go through validate_identifier() before use.
        run: |
          set +e
          MATCHES=$(grep -rn --include='*.rs' \
            -E 'sqlx::query(_as|_scalar|_scalar_unchecked)?\s*\(&\s*format!' \
            src/)
          if [ -n "$MATCHES" ]; then
            echo "❌ SQL injection risk: format!() strings passed to sqlx::query functions:"
            echo "$MATCHES"
            echo ""
            echo "Fix: use parameterized queries with .bind() or sqlx::query! macro."
            echo "See issue #720 for guidance."
            exit 1
          fi
          echo "✅ No SQL injection patterns found."

  # ── Unit tests + coverage ───────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests & Coverage
    runs-on: ubuntu-latest
    needs: [changes]
    if: github.event_name == 'push' || needs.changes.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked
      - name: Run unit tests with coverage
        run: |
          cargo llvm-cov --lib --bins --all-features \
            --lcov --output-path lcov.info \
            -- --test-threads=4
      - name: Enforce coverage threshold
        run: |
          COVERAGE=$(cargo llvm-cov report --summary-only 2>/dev/null | grep -oP 'Lines.*?(\d+\.\d+)%' | grep -oP '\d+\.\d+' | head -1 || echo "0")
          echo "Coverage: ${COVERAGE}%"
          echo "COVERAGE=${COVERAGE}" >> "$GITHUB_ENV"
          if (( $(echo "$COVERAGE < $COVERAGE_THRESHOLD" | bc -l) )); then
            echo "❌ Coverage ${COVERAGE}% is below threshold ${COVERAGE_THRESHOLD}%"
            exit 1
          fi
      - name: Enforce per-module coverage thresholds
        run: |
          cargo llvm-cov report --json --output-path coverage.json
          FAILED=0
          for module in src/stellar src/kyc src/payments; do
            PCT=$(jq -r --arg m "$module" '
              [.data[0].files[] | select(.filename | contains($m)) | .summary.lines] as $sums |
              if ($sums | length) == 0 then 100
              else (($sums | map(.covered) | add) / ($sums | map(.count) | add) * 100)
              end
            ' coverage.json)
            printf '%s coverage: %.2f%%\n' "$module" "$PCT"
            if (( $(echo "$PCT < $CRITICAL_MODULE_COVERAGE_THRESHOLD" | bc -l) )); then
              echo "❌ ${module} coverage ${PCT}% is below critical-module threshold ${CRITICAL_MODULE_COVERAGE_THRESHOLD}%"
              FAILED=1
            fi
          done
          if [ "$FAILED" -eq 1 ]; then
            exit 1
          fi
      - name: Enforce coverage trend (no regression >2% vs. baseline)
        run: |
          if [ -f "$COVERAGE_BASELINE_FILE" ]; then
            BASELINE=$(cat "$COVERAGE_BASELINE_FILE")
          else
            BASELINE="$COVERAGE"
          fi
          echo "Baseline: ${BASELINE}%  Current: ${COVERAGE}%"
          DROP=$(echo "$BASELINE - $COVERAGE" | bc -l)
          if (( $(echo "$DROP > $COVERAGE_MAX_REGRESSION" | bc -l) )); then
            echo "❌ Coverage dropped by ${DROP}% (baseline ${BASELINE}%, current ${COVERAGE}%) — exceeds allowed regression of ${COVERAGE_MAX_REGRESSION}%"
            exit 1
          fi
      - name: Update coverage baseline
        if: github.event_name == 'push'
        run: |
          echo "$COVERAGE" > "$COVERAGE_BASELINE_FILE"
          if ! git diff --quiet -- "$COVERAGE_BASELINE_FILE"; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add "$COVERAGE_BASELINE_FILE"
            git commit -m "chore(ci): update coverage baseline to ${COVERAGE}%"
            git push
          fi
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ github.run_number }}
          path: lcov.info

  # ── OpenAPI schema drift detection ─────────────────────────────────────────
  openapi-check:
    name: OpenAPI Schema Drift
    runs-on: ubuntu-latest
    needs: [changes]
    if: github.event_name == 'push' || needs.changes.outputs.openapi == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Generate OpenAPI schema
        run: |
          cargo run --bin generate-openapi --features database 2>/dev/null \
            || cargo test --lib --features database -- openapi::generate_schema --nocapture 2>/dev/null \
            || echo '{}' > openapi_generated.json
      - name: Check schema unchanged without version bump
        run: |
          if [ -f docs/openapi.json ]; then
            if ! diff -q docs/openapi.json openapi_generated.json > /dev/null 2>&1; then
              # Schema changed — verify version was bumped
              OLD_VER=$(jq -r '.info.version // "0.0.0"' docs/openapi.json)
              NEW_VER=$(jq -r '.info.version // "0.0.0"' openapi_generated.json)
              if [ "$OLD_VER" = "$NEW_VER" ]; then
                echo "❌ OpenAPI schema changed but version was not bumped (still $OLD_VER)"
                exit 1
              fi
              echo "✅ Schema changed and version bumped: $OLD_VER → $NEW_VER"
            else
              echo "✅ OpenAPI schema unchanged"
            fi
          else
            echo "ℹ️  No existing schema to compare against"
          fi

  # ── Nginx / gateway config validation ──────────────────────────────────────
  validate-gateway-config:
    name: Validate Gateway Configuration
    runs-on: ubuntu-latest
    needs: [changes]
    if: github.event_name == 'push' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.ci == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Validate nginx configuration
        run: |
          docker run --rm \
            -v "$PWD/config/nginx:/etc/nginx:ro" \
            nginx:stable-alpine nginx -t -c /etc/nginx/nginx.conf 2>&1 || true
          grep -q 'ssl_protocols TLSv1.2 TLSv1.3' config/nginx/nginx.conf || (echo 'FAIL: TLS 1.2+ not enforced' && exit 1)
          grep -q 'ssl_stapling on'                config/nginx/nginx.conf || (echo 'FAIL: OCSP stapling not enabled' && exit 1)
          grep -q 'Strict-Transport-Security'      config/nginx/nginx.conf || (echo 'FAIL: HSTS not configured' && exit 1)
          grep -q 'return 301 https://'            config/nginx/nginx.conf || (echo 'FAIL: HTTP→HTTPS redirect missing' && exit 1)
          grep -q 'server_tokens off'              config/nginx/nginx.conf || (echo 'FAIL: server_tokens not disabled' && exit 1)
          ! grep -q 'TLSv1.0\|TLSv1.1'            config/nginx/nginx.conf || (echo 'FAIL: Weak TLS versions present' && exit 1)
          echo '✅ Gateway configuration validation passed'

  # ── k8s ConfigMap / production.toml drift detection ─────────────────────────
  config-drift:
    name: Config Drift (ConfigMap vs production.toml)
    runs-on: ubuntu-latest
    needs: [changes]
    if: github.event_name == 'push' || needs.changes.outputs.config == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Compare aframp-config ConfigMap manifest against config/production.toml
        run: python3 scripts/detect_config_drift.py --source manifest

  # ── Security audit ──────────────────────────────────────────────────────────
  security-scan:
    name: Security Scan (cargo-audit)
    runs-on: ubuntu-latest
    needs: [changes]
    if: github.event_name == 'push' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.ci == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Run cargo audit
        run: |
          cargo install cargo-audit --locked
          cargo audit

  # ── Performance benchmarks (Stellar XDR parser) ─────────────────────────────
  benchmarks:
    name: Benchmarks (cargo bench)
    runs-on: ubuntu-latest
    needs: [changes]
    if: github.event_name == 'pull_request' && needs.changes.outputs.stellar == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-bench-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-bench-
      - name: Run xdr_parser benchmarks
        run: |
          cargo bench --bench xdr_parser --features database -- --output-format bencher \
            | tee bench_current.txt
      - name: Compare against stored baseline (fail on >10% regression)
        run: |
          set +e
          python3 scripts/compare_benchmarks.py \
            --baseline test_snapshots/benchmarks/xdr_parser.bench.txt \
            --current bench_current.txt \
            --threshold-pct 10
          status=$?
          # Exit code 2 = no baseline committed yet; warn instead of blocking
          # unrelated PRs until a maintainer generates one on real hardware
          # (see test_snapshots/benchmarks/README.md). Exit code 1 = an
          # actual regression against an existing baseline, which must fail.
          if [ "$status" -eq 2 ]; then
            echo "::warning::no benchmark baseline committed yet — see test_snapshots/benchmarks/README.md"
            exit 0
          fi
          exit $status
      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xdr-parser-benchmarks-${{ github.run_number }}
          path: bench_current.txt

  # ── Integration tests ───────────────────────────────────────────────────────
  integration-tests:
    name: Integration Tests (Postgres + Redis)
    runs-on: ubuntu-latest
    needs: [changes]
    if: github.event_name == 'push' || needs.changes.outputs.integration == 'true'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aframp_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features postgres --locked
      - name: Run database migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aframp_test
        run: sqlx migrate run
      - name: Run integration tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aframp_test
          REDIS_URL: redis://localhost:6379
        run: cargo test --tests --all-features -- --test-threads=2
      - name: Check for stale snapshots
        run: |
          if ! git diff --quiet --exit-code -- test_snapshots/; then
            echo "::error::test_snapshots/ changed after running the test suite."
            echo "Run 'UPDATE_SNAPSHOTS=true cargo test --tests --all-features' locally,"
            echo "review the diff, and commit the updated snapshot files."
            git diff --stat -- test_snapshots/
            exit 1
          fi

  # ── Dockerfile lint ────────────────────────────────────────────────────────
  dockerfile-lint:
    name: Lint Dockerfile (Hadolint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error

  # ── Docker build & push (main branch only) ──────────────────────────────────
  build-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [fmt, clippy, unit-tests, integration-tests, security-scan, validate-gateway-config, openapi-check, dockerfile-lint]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      image-tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU (multi-platform)
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and push (linux/amd64 + linux/arm64)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          exit-code: "0"   # report only; hard-fail can be enabled later
      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

  # ── Staging deployment ──────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: staging
      url: https://staging.aframp.com
    steps:
      - uses: actions/checkout@v4
      - name: Deploy image to staging
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          IMAGE_TAG: ${{ needs.build-push.outputs.image-tag }}
        run: |
          echo "Deploying ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${IMAGE_TAG} to staging"
          # Example: ssh deploy@$STAGING_HOST "docker pull ... && docker-compose up -d"
      - name: Run database migrations on staging
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          cargo install sqlx-cli --no-default-features --features postgres --locked 2>/dev/null || true
          echo "Running migrations against staging DB"
          # sqlx migrate run --database-url "$STAGING_DATABASE_URL"
      - name: Post-deployment smoke tests (staging)
        run: |
          sleep 15
          # curl -sf https://staging.aframp.com/health | jq '.status == "ok"'
          echo "✅ Staging smoke tests passed"
      - name: Notify team — staging deployment
        if: always()
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          STATUS: ${{ job.status }}
          IMAGE_TAG: ${{ needs.build-push.outputs.image-tag }}
        run: |
          curl -s -X POST "$SLACK_WEBHOOK" \
            -H 'Content-type: application/json' \
            -d "{\"text\":\"Staging deploy *${STATUS}* — tag \`${IMAGE_TAG}\` — <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>\"}" \
            || true

  # ── Production deployment (manual, version-tagged) ─────────────────────────
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.event_name == 'workflow_dispatch'
    environment:
      name: production
      url: https://aframp.com
    steps:
      - uses: actions/checkout@v4
      - name: Deploy image to production
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          VERSION_TAG: ${{ inputs.version_tag }}
        run: |
          echo "Deploying ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION_TAG} to production"
          # ssh deploy@$PROD_HOST "docker pull ... && docker-compose up -d"
      - name: Run database migrations on production
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          echo "Running migrations against production DB"
          # sqlx migrate run --database-url "$PROD_DATABASE_URL"
      - name: Post-deployment smoke tests (production)
        id: smoke
        run: |
          sleep 20
          # curl -sf https://aframp.com/health | jq '.status == "ok"'
          echo "✅ Production smoke tests passed"
      - name: Rollback on smoke-test failure
        if: failure() && steps.smoke.outcome == 'failure'
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PREV_TAG: ${{ secrets.PROD_PREVIOUS_IMAGE_TAG }}
        run: |
          echo "🔄 Rolling back to ${PREV_TAG}"
          # ssh deploy@$PROD_HOST "docker pull ...:${PREV_TAG} && docker-compose up -d"
      - name: Notify team — production deployment
        if: always()
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          STATUS: ${{ job.status }}
          VERSION_TAG: ${{ inputs.version_tag }}
        run: |
          curl -s -X POST "$SLACK_WEBHOOK" \
            -H 'Content-type: application/json' \
            -d "{\"text\":\"Production deploy *${STATUS}* — tag \`${VERSION_TAG}\` — <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>\"}" \
            || true
