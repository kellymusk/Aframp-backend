name: Cargo.lock up to date

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [dev-backend]

jobs:
  lockfile:
    name: Cargo.lock matches Cargo.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-lockcheck-${{ hashFiles('**/Cargo.lock') }}

      # --locked fails immediately if Cargo.lock doesn't already satisfy
      # every constraint in Cargo.toml, instead of silently rewriting it —
      # exactly the drift this check exists to catch (a Cargo.toml version
      # bump committed without regenerating the lockfile, or vice versa).
      - name: Verify Cargo.lock is up to date
        run: |
          if ! cargo check --locked --all-targets; then
            echo "::error::Cargo.lock is out of date or inconsistent with Cargo.toml."
            echo "::error::Do NOT modify Cargo.toml or Cargo.lock on dev-backend."
            echo "::error::If you accidentally ran 'cargo add' or similar, revert the lockfile changes."
            echo "::error::See CONTRIBUTING.md for the dependency policy on dev-backend."
            exit 1
          fi