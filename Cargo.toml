[package]
name = "handsoff-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1"
anyhow = "1"
dotenv = "0.15"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

# Dependency vulnerability scanning (issue #1068).
# `cargo audit` reads this section to suppress known false positives.
# Each ignore entry MUST include a justification comment and an expiry date
# so stale suppressions are revisited during weekly CI runs.
[package.metadata.audit]
# Fail the CI job on any advisory at or above this severity.
# cargo-audit does not natively support severity thresholds, so the CI job
# runs `cargo audit --deny warnings` and this value documents the policy.
severity-threshold = "high"

[package.metadata.audit.ignore]
# Example (kept commented until a real false positive is confirmed):
# RUSTSEC-0000-0000 = { reason = "Not exploitable in our usage; upstream fix pending", expires = "2025-12-31" }
