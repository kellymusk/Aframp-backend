[package]
name = "aframp"
version = "0.1.0"
edition = "2021"

[dependencies]
aes-gcm = "0.11.0"
anyhow = "1"
argon2 = "0.5"
async-trait = "0.1"
axum = "0.8"
base64 = "0.21"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
ed25519-dalek = "3.0.0"
hex = "0.4"
hmac = "0.12"
http = "1"
jsonwebtoken = "9"
rand = "0.8"
reqwest = { version = "0.13.4", default-features = false, features = ["form", "json", "query", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "macros"] }
stellar-strkey = "0.0.18"
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower-http = { version = "0.6", features = ["trace", "limit", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
stellar-base = "0.7.0"
tower = { version = "0.5", features = ["util"] }
