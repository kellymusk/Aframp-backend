[package]
name = "aframp"
version = "0.1.0"
edition = "2021"

[dependencies]
aes-gcm = "=0.11.0"
argon2 = "=0.5.3"
async-trait = "=0.1.91"
axum = "=0.8.9"
chrono = { version = "=0.4.45", features = ["serde"] }
dotenvy = "=0.15.7"
ed25519-dalek = "=3.0.0"
hex = "=0.4.3"
hmac = "=0.12.1"
http = "=1.5.0"
jsonwebtoken = "=9.3.1"
mime = "=0.3.17"
rand = "=0.8.7"
reqwest = { version = "=0.13.4", default-features = false, features = ["form", "json", "query", "rustls"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
sqlx = { version = "=0.8.6", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "macros"] }
stellar-strkey = "=0.0.18"
thiserror = "=1.0.69"
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread"] }
tower-http = { version = "=0.6.11", features = ["trace", "limit", "cors"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
uuid = { version = "=1.24.0", features = ["v4", "serde"] }

[dev-dependencies]
stellar-base = "=0.7.0"
tower = { version = "=0.5.3", features = ["util"] }
