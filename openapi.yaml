openapi: 3.0.3
info:
  title: Aframp Pay API
  version: 0.1.0
  description: >
    Merchant-facing backend for Aframp Pay — Stellar-settled point-of-sale payments.
    Prose reference with frontend guidance lives in API.md; this spec is the
    machine-readable contract for generating typed clients.


    Money is always integer stroops (1 unit = 10,000,000 stroops), never a float.
servers:
  - url: http://127.0.0.1:3000
    description: Local development

tags:
  - name: System
  - name: Auth
  - name: Wallet
  - name: Payment requests
  - name: Money
  - name: Analytics
    description: Proposed merchant reporting contract; endpoint is not implemented yet.
  - name: Webhooks
    description: Provider callbacks — not for merchant or admin use
  - name: Admin
    description: System-wide views. Requires an admin JWT (`is_admin = true` baked in at login).

# Either authenticates. The Authorization header wins when both are sent.
security:
  - cookieAuth: []
  - bearerAuth: []

paths:
  /:
    get:
      tags: [System]
      summary: Service name
      description: Returns the literal string `aframp` as text/plain, not JSON.
      security: []
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema: { type: string, example: aframp }
        '500': { $ref: '#/components/responses/InternalError' }

  /health:
    get:
      tags: [System]
      summary: Liveness probe
      security: []
      responses:
        '204': { description: Service is up (empty body) }
        '500': { $ref: '#/components/responses/InternalError' }

  /signup:
    post:
      tags: [Auth]
      summary: Start signup — sends an OTP
      description: >
        Does NOT create the account. Validates the credentials, sends an OTP
        to phone_number, and returns a challenge; the user and merchant are
        only inserted once POST /verify-otp succeeds. Re-submitting the same
        email before it's ever verified is the resend path, not a conflict.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SignupRequest' }
      responses:
        '200':
          description: OTP sent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OtpChallengeResponse' }
        '400':
          description: >
            INVALID_PARAMETERS — malformed body, invalid email, password shorter
            than 8 characters, or an unparseable phone_number.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '409':
          description: >
            EMAIL_TAKEN or PHONE_TAKEN — already registered to a verified account.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429':
          description: >
            TOO_MANY_REQUESTS — OTP resend cooldown or hourly cap hit.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '500': { $ref: '#/components/responses/InternalError' }

  /login:
    post:
      tags: [Auth]
      summary: Authenticate — sends an OTP if the phone is verified
      description: >
        Returns 401 for both a wrong password and an unknown email — deliberately
        indistinguishable, so do not derive a "no such account" message from it.
        On success, a phone-verified account gets a fresh OTP challenge (same
        shape as /signup) instead of a session — two-factor on every login.
        Only an account with no phone on file (pre-OTP-rollout only) gets the
        session directly, same as before.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Either an OTP challenge (normal case) or a session (legacy account only)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/OtpChallengeResponse'
                  - $ref: '#/components/schemas/AuthResponse'
        '401':
          description: >
            INVALID_CREDENTIALS — wrong password or unknown email, deliberately
            indistinguishable. Also USER_NOT_FOUND in the same shape.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429':
          description: >
            TOO_MANY_REQUESTS — OTP resend cooldown or hourly cap hit.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '500': { $ref: '#/components/responses/InternalError' }

  /verify-otp:
    post:
      tags: [Auth]
      summary: Complete a signup or login challenge
      description: >
        The only endpoint that ever issues a session. For a signup challenge,
        the user and merchant are created transactionally here, not before.
        Sets the aframp_session HttpOnly cookie and echoes the same JWT in the
        body for API clients. Browsers should rely on the cookie and ignore the
        token field — storing it in localStorage exposes the session to XSS.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerifyOtpRequest' }
      responses:
        '200':
          description: Session issued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400':
          description: >
            INVALID_PARAMETERS (malformed body), OTP_INVALID, OTP_EXPIRED, or
            OTP_LOCKED (too many wrong attempts).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '404':
          description: OTP_CHALLENGE_NOT_FOUND — unknown or already-consumed challenge_id
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '409':
          description: >
            EMAIL_TAKEN or PHONE_TAKEN — taken by someone else between signup
            and verification.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429':
          description: TOO_MANY_REQUESTS — OTP verification rate limit hit.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '500': { $ref: '#/components/responses/InternalError' }

  /logout:
    post:
      tags: [Auth]
      summary: Clear the session cookie
      description: >
        Unauthenticated by design — a browser holding an expired or malformed
        session still needs a way to clear it. This ends the browser session
        only; it does not revoke a JWT that has been copied elsewhere.
      security: []
      responses:
        '204':
          description: Session cookie expired
          headers:
            Set-Cookie:
              schema: { type: string }
              description: aframp_session with Max-Age=0
        '500': { $ref: '#/components/responses/InternalError' }

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Exchange a valid session token for a fresh one
      description: >
        Send the current, unexpired token (bearer or session cookie) to get a
        new 24h token, also set as the session cookie. Refreshes keep the
        original login time and stop 7 days after it (the new token never
        expires later than that); after that, or once the token has expired,
        log in again.
      responses:
        '200':
          description: New session token
          headers:
            Set-Cookie:
              schema: { type: string }
              description: aframp_session with the new token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me:
    get:
      tags: [Auth]
      summary: Current user profile
      description: >
        The JWT carries only ids, so call this after a page reload to render
        human-readable identity without forcing a re-login.
      responses:
        '200':
          description: Profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401':
          description: >
            INVALID_CREDENTIALS — missing, malformed, or expired token.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '404':
          description: USER_NOT_FOUND — the token's user no longer exists.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '500': { $ref: '#/components/responses/InternalError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Auth]
      summary: Update the signed-in user's name and/or phone number
      description: >
        A new name applies immediately. A new phone number is not switched
        right away: an OTP is sent to it and the response carries
        `phone_verification`; completing `POST /verify-otp` with that
        challenge moves the account to the new number (same flow as signup).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 100 }
                phone_number: { type: string, description: Nigerian number in any common form }
      responses:
        '200':
          description: Name updated and/or phone verification started
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: { type: string }
                  phone_number: { type: string, nullable: true, description: The number on file (unchanged until verified) }
                  phone_verification:
                    nullable: true
                    allOf: [{ $ref: '#/components/schemas/OtpChallengeResponse' }]
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: The phone number belongs to another account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '429':
          description: Too many OTP sends to that number; try again shortly
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
    delete:
      tags: [Auth]
      summary: Delete the signed-in account (right to erasure)
      description: >
        Soft delete: email, name, phone number and password are erased in
        place and pending OTP challenges removed; payments, payment requests,
        withdrawals, wallets and balances are kept for the financial audit
        trail. All tokens for the account stop working immediately.
      responses:
        '204':
          description: Account deleted; session cookie cleared
          headers:
            Set-Cookie:
              schema: { type: string }
              description: aframp_session with Max-Age=0
        '401': { $ref: '#/components/responses/Unauthorized' }

  /wallet/create:
    post:
      tags: [Wallet]
      summary: Generate a Stellar wallet
      description: >
        Generates a real ed25519 keypair; the private key is AES-256-GCM encrypted
        server-side and never returned. NOT idempotent — each call creates another
        wallet, and GET /wallet then returns the newest. Check GET /wallet first.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateWalletRequest' }
      responses:
        '200':
          description: Wallet created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Wallet' }
        '400':
          description: >
            INVALID_PARAMETERS (malformed body) or MERCHANT_NOT_FOUND — the
            account has no merchant.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '401':
          description: INVALID_CREDENTIALS — missing, malformed, or expired token.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '500': { $ref: '#/components/responses/InternalError' }

  /merchants/me:
    get:
      tags: [Merchant]
      summary: Current user's merchant profile
      description: >
        Returns the full Merchant model for the signed-in user, separate from
        GET /me which carries only the auth-identity fields. Use this to render
        richer merchant/business profile data without bloating /me.
      responses:
        '200':
          description: Merchant profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Merchant' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: MERCHANT_NOT_FOUND — the signed-in user has no merchant profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '500': { $ref: '#/components/responses/InternalError' }

  /wallet:
    get:
      tags: [Wallet]
      summary: Get the merchant's most recent wallet
      responses:
        '200':
          description: Wallet
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Wallet' }
        '400':
          description: >
            WALLET_NOT_FOUND — no wallet created yet, run onboarding. Also
            MERCHANT_NOT_FOUND for an account with no merchant.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '401':
          description: INVALID_CREDENTIALS — missing, malformed, or expired token.
        '404':
          description: No wallet created yet — run onboarding
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '500': { $ref: '#/components/responses/InternalError' }

  /payment-requests:
    post:
      tags: [Payment requests]
      summary: Create a payment request
      description: >
        The core POS action. Returns a SEP-0007 URI to render as a QR code.
        sep7_uri is null for non-XLM assets (no cNGN issuer address configured yet).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePaymentRequest' }
      responses:
        '200':
          description: Payment request created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentRequest' }
        '400':
          description: >
            INVALID_PARAMETERS (malformed body), INVALID_AMOUNT (non-positive or
            out of range), UNSUPPORTED_ASSET (asset other than XLM/cNGN), or
            MERCHANT_NOT_FOUND.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '401':
          description: INVALID_CREDENTIALS — missing, malformed, or expired token.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404':
          description: Wallet not found for this merchant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '500': { $ref: '#/components/responses/InternalError' }
    get:
      tags: [Payment requests]
      summary: List the merchant's payment requests
      description: Newest first, scoped to the authenticated merchant.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Payment requests, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PaymentRequest' }
        '400':
          description: >
            INVALID_PARAMETERS — limit is not an integer, or MERCHANT_NOT_FOUND.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '401':
          description: INVALID_CREDENTIALS — missing, malformed, or expired token.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '500': { $ref: '#/components/responses/InternalError' }
                type: object
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/PaymentRequest' }
                  next_cursor:
                    type: string
                    nullable: true
                    description: Pass as `cursor` to fetch the next page; null on the last page.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /payment-requests/{id}:
    get:
      tags: [Payment requests]
      summary: Read a payment request (public)
      description: >
        Deliberately unauthenticated so a customer's device can read a request
        before paying. Prefer GET /payment-requests/{id}/status for polling
        after the customer has submitted payment.
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Payment request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentRequest' }
        '404':
          description: PAYMENT_REQUEST_NOT_FOUND — no request with that id.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '500': { $ref: '#/components/responses/InternalError' }

  /payment-requests/{id}/status:
    get:
      tags: [Payment requests]
      summary: Poll a payment request's status (public)
      description: >
        Lightweight alternative to GET /payment-requests/{id} for high-frequency
        polling: returns only the id, status, and paid_at, not the full request
        object. Public, like the parent endpoint. 'expired' is computed at read
        time from expires_at; a request that expires and is then paid still flips
        to 'paid'.
  /payment-requests/{id}/cancel:
    post:
      tags: [Payment requests]
      summary: Cancel a pending payment request
      description: >
        Lets a merchant void a request they created by mistake (wrong amount or
        asset) instead of waiting up to 24 hours for it to expire. Scoped to the
        authenticated merchant — a request belonging to someone else is reported
        as 404, not 403, so the endpoint cannot be used to probe for other
        merchants' request ids. Only a request that is still pending can be
        cancelled; once it has been paid, partially paid, or has expired, the
        cancel is rejected with 409. Cancelling is idempotent in effect: a
        request already in the cancelled state returns 409 like any other
        non-pending status.
  /payment-requests/{id}/status:
    get:
      tags: [Payment requests]
      summary: Poll payment-request status (public)
      description: >
        Lightweight status-only endpoint for customer-side polling after a QR
        payment. Uses the same effective_status rules as the full object
        (overdue pending → expired). Returns Cache-Control: public, max-age=5.
      security: []
      parameters:
        - name: id
          in: path
          required: true
          description: Payment request id.
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Payment request status
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Payment request cancelled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: PAYMENT_REQUEST_NOT_FOUND — unknown id, or one owned by another merchant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '409':
          description: >
            The request is no longer pending — already paid, partially paid,
            expired, or already cancelled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
          description: Status payload
          headers:
            Cache-Control:
              schema: { type: string, example: 'public, max-age=5' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentRequestStatus' }
        '404': { $ref: '#/components/responses/NotFound' }

  /balance:
    get:
      tags: [Money]
      summary: Balances by asset
      description: Returns an empty array for a new merchant — not an error.
      responses:
        '200':
          description: Balances
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Balance' }
        '400':
          description: >
            INVALID_PARAMETERS or MERCHANT_NOT_FOUND — the account has no merchant.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '401':
          description: INVALID_CREDENTIALS — missing, malformed, or expired token.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '500': { $ref: '#/components/responses/InternalError' }

  /transactions:
    get:
      tags: [Money]
      summary: Detected incoming payments
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Payments, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Payment' }
        '400':
          description: >
            INVALID_PARAMETERS (bad limit) or MERCHANT_NOT_FOUND — the account
            has no merchant.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '401':
          description: INVALID_CREDENTIALS — missing, malformed, or expired token.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '500': { $ref: '#/components/responses/InternalError' }
                type: object
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Payment' }
                  next_cursor:
                    type: string
                    nullable: true
                    description: Pass as `cursor` to fetch the next page; null on the last page.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /analytics:
    get:
      tags: [Analytics]
      summary: Merchant payment analytics (proposed)
      description: >
        Proposed contract only; this endpoint is not currently served. Daily
        aggregates use UTC dates and include confirmed payments. Volume values
        are integer stroops. total_paid_requests counts requests created in the
        selected period that reached paid status; success_rate is paid requests
        divided by all requests created in that period, from 0 to 1.
      x-implementation-status: planned
      parameters:
        - name: period
          in: query
          required: true
          schema:
            type: string
            enum: [7d, 30d, 90d]
      responses:
        '200':
          description: Proposed merchant-scoped analytics response
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalyticsResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /withdraw:
    post:
      tags: [Money]
      summary: Withdraw to a Nigerian bank account
      description: >
        Debits the balance and calls Paystack Transfers. On provider failure the
        API returns 502 with code PAYOUT_FAILED. The withdrawal row is already
        created (then marked failed) and the balance is refunded — clients must
        NOT auto-retry; start a new withdrawal only if the user explicitly retries.
        Payouts do not currently complete in production (Paystack balance unfunded).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateWithdrawalRequest' }
      responses:
        '200':
          description: Withdrawal accepted by the provider
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Withdrawal' }
        '400':
          description: >
            INVALID_PARAMETERS (malformed body, bad bank_code, non-10-digit
            account_number), INVALID_AMOUNT (not a whole multiple of 100000, or
            below Paystack's NGN 50 minimum), UNSUPPORTED_ASSET (asset other than
            cNGN), INSUFFICIENT_BALANCE, or MERCHANT_NOT_FOUND.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '401':
          description: INVALID_CREDENTIALS — missing, malformed, or expired token.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '500': { $ref: '#/components/responses/InternalError' }
        '502':
          description: >
            PAYOUT_FAILED — payout provider failed; balance already refunded.
            Payout provider failed (`PAYOUT_FAILED`). The withdrawal row was
            already created, then marked failed, and the balance was refunded.
            Clients must NOT auto-retry this request — a retry creates a
            duplicate withdrawal attempt. Show the error and let the user
            start a new withdrawal if needed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
              example:
                error: simulated provider failure
                code: PAYOUT_FAILED

  /withdrawals:
    get:
      tags: [Money]
      summary: List withdrawals
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Withdrawals, newest first
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Withdrawal' }
                  next_cursor:
                    type: string
                    nullable: true
                    description: Pass as `cursor` to fetch the next page; null on the last page.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /webhooks/termii:
    post:
      tags: [Webhooks]
      summary: Termii SMS delivery-status callback
      description: >
        Register this URL at https://termii.com/account/webhook/config — it is
        a single account-wide setting, not something passed per API call.
        Termii POSTs SMS delivery-status events (Delivered, Message Failed,
        Rejected, etc.) signed with X-Termii-Signature (HMAC-SHA512 over the
        raw request body, keyed by TERMII_API_KEY). This endpoint verifies the
        signature, logs the event, and always acks with 204 for any recognized
        or unrecognized event shape so Termii never retries a genuine delivery.
        Not for merchant or admin use.
      security: []
      parameters:
        - name: X-Termii-Signature
          in: header
          required: true
          description: HMAC-SHA512 of the raw request body, keyed by TERMII_API_KEY.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TermiiWebhookEvent' }
      responses:
        '204':
          description: Event acknowledged (signature valid)
        '403':
          description: Invalid webhook signature
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /admin:
    get:
      tags: [Admin]
      summary: Admin dashboard shell
      description: >
        Static HTML/JS dashboard. Unauthenticated by design — no data is baked
        into the markup. The dashboard logs in via /login (setting the same
        HttpOnly session cookie) and every data fetch rides the cookie.
        Known gap: the login form only handles the one-step legacy flow; an
        admin account with a phone number will appear to fail to log in until
        the dashboard is updated for the OTP challenge step.
      security: []
      responses:
        '200':
          description: Dashboard HTML
          content:
            text/html:
              schema: { type: string }

  /admin/overview:
    get:
      tags: [Admin]
      summary: System-wide counts and status breakdowns
      description: Aggregated totals across every merchant. Requires admin JWT.
      security:
        - adminBearerAuth: []
        - adminCookieAuth: []
      responses:
        '200':
          description: Overview
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminOverview' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/merchants:
